name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes do Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências do backend
        working-directory: backend
        run: npm install

      - name: Executar testes
        working-directory: backend
        run: npm test

  build:
    name: Build das Imagens Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build da imagem do backend
        run: docker build -t filmesseries-backend ./backend

      - name: Build da imagem do frontend
        run: docker build -t filmesseries-frontend ./frontend

      - name: Validar containers
        run: |
          docker images | grep filmesseries-backend
          docker images | grep filmesseries-frontend
          echo "✅ Imagens construídas com sucesso"